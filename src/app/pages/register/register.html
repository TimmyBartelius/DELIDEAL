<div class="d-flex flex-column vh-100 bg-light">
  <main class="flex-fill d-flex flex-column justify-content-center align-items-center">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%">
      <h2 class="text-center mb-4">Skapa konto</h2>

      <!-- Loader/Spinner -->
      <div *ngIf="isLoading" class="d-flex justify-content-center my-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Laddar...</span>
        </div>
      </div>

      <!-- Felmeddelande/Bekräftelse -->
      <div *ngIf="errorMessage" class="alert alert-info" [innerHTML]="errorMessage"></div>

      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <!-- Användarnamn -->
        <div class="mb-3">
          <label for="userName" class="form-label">Användarnamn</label>
          <input
            id="userName"
            type="text"
            class="form-control"
            formControlName="userName"
            placeholder="Användarnamn"
          />
          <div
            *ngIf="registerForm.get('userName')?.touched && registerForm.get('userName')?.invalid"
            class="text-danger small mt-1"
          >
            Användarnamn krävs
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="Email"
          />
          <div
            *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
            class="text-danger small mt-1"
          >
            Ange en giltig email
          </div>
        </div>

        <!-- Lösenord -->
        <div class="mb-3">
          <label for="password" class="form-label">Lösenord</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Lösenord"
          />
          <div
            *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors"
            class="text-danger small mt-1"
          >
            <ng-container *ngIf="registerForm.get('password')?.errors?.['required']">
              Lösenord krävs
            </ng-container>
            <ng-container *ngIf="registerForm.get('password')?.errors?.['minlength']">
              Lösenordet måste vara minst 8 tecken långt
            </ng-container>
            <ng-container *ngIf="registerForm.get('password')?.errors?.['letter']">
              Lösenordet måste innehålla minst en bokstav
            </ng-container>
            <ng-container *ngIf="registerForm.get('password')?.errors?.['digit']">
              Lösenordet måste innehålla minst en siffra
            </ng-container>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-success w-100" [disabled]="registerForm.invalid">
          Registrera
        </button>
      </form>

      <div class="text-center mt-3">
        <span>Har du redan ett konto?</span>
        <a routerLink="/login">Logga in här</a>
      </div>
    </div>
  </main>
</div>
